---
# =============================================================================
# inventory/group_vars/all/vault.yml
#
# THIS FILE MUST BE ENCRYPTED BEFORE COMMITTING.
# Encrypt with: ansible-vault encrypt inventory/group_vars/all/vault.yml
# Edit with:    ansible-vault edit inventory/group_vars/all/vault.yml
#
# This is the TEMPLATE showing variable names only.
# Fill in real values then encrypt immediately.
# =============================================================================

# ── Vault AppRole credentials (retrieved from ~/.vault/approle-creds.yml) ─────
vault_approle_role_id:   "FILL_IN_AFTER_VAULT_INIT"
vault_approle_secret_id: "FILL_IN_AFTER_VAULT_INIT"

# ── Proxmox API token (used by Ansible when calling Proxmox API directly) ─────
proxmox_api_token_id: "root@pam!rootpat"
proxmox_api_token_secret: "dc9574c4-65d3-4947-ab87-afa210a7ead5"

# ── Docker Hub credentials (replaces hardcoded values in original project) ────
dockerhub_username: "FILL_IN"
dockerhub_password: "FILL_IN"
dockerhub_email:    "FILL_IN"

# ── Keycloak admin credentials ────────────────────────────────────────────────
keycloak_admin_user:     "admin"
keycloak_admin_password: "FILL_IN_STRONG_PASSWORD"

# ── Database credentials ──────────────────────────────────────────────────────
postgresql_password:    "FILL_IN_STRONG_PASSWORD"
mariadb_root_password:  "FILL_IN_STRONG_PASSWORD"

# ── RabbitMQ credentials ──────────────────────────────────────────────────────
rabbitmq_user:     "FILL_IN"
rabbitmq_password: "FILL_IN_STRONG_PASSWORD"

# ── Ansible Vault password (bootstrap only) ───────────────────────────────────
# This is only used during initial setup — stored in ~/.vault/.vault-password
# on runner-01, never in the repo.
