---
# =============================================================================
# roles/common/tasks/main.yml
# Baseline hardening applied to every LXC node.
# Implements CIS Benchmark Level 1 controls applicable to LXC containers.
# =============================================================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages to latest security releases
  ansible.builtin.apt:
    upgrade: safe
  notify: restart services if needed

- name: Install baseline security packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - auditd
      - libpam-pwquality
      - sudo
      - curl
      - wget
      - git
      - python3
      - python3-pip
      - ca-certificates
      - gnupg
      - jq
      - vim
    state: present

- name: Configure unattended upgrades for security patches
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
    owner: root
    group: root
    mode: "0644"

- name: Ensure ansible user exists
  ansible.builtin.user:
    name: ansible
    shell: /bin/bash
    groups: sudo
    append: true
    state: present
    create_home: true

- name: Configure passwordless sudo for ansible user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ansible
    content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Ensure .ssh directory exists for ansible user
  ansible.builtin.file:
    path: /home/ansible/.ssh
    state: directory
    owner: ansible
    group: ansible
    mode: "0700"

- name: Deploy ansible SSH authorized key
  ansible.builtin.authorized_key:
    user: ansible
    key: "{{ ansible_runner_public_key }}"
    state: present
    exclusive: true

- name: Harden SSH configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowTcpForwarding no
      MaxAuthTries 3
      LoginGraceTime 20
      ClientAliveInterval 300
      ClientAliveCountMax 2
    owner: root
    group: root
    mode: "0600"
  notify: restart sshd

- name: Configure UFW default policies
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow outbound traffic by default
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.conf
    content: |
      [sshd]
      enabled  = true
      port     = ssh
      maxretry = 5
      bantime  = 3600
      findtime = 600
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Enable and start required services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - ufw
    - fail2ban
    - auditd
    - unattended-upgrades

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Configure auditd rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/99-baseline.rules
    content: |
      # Monitor authentication events
      -w /etc/passwd -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/sudoers -p wa -k sudoers
      # Monitor SSH
      -w /etc/ssh/sshd_config -p wa -k sshd
      # Monitor cron
      -w /etc/cron.d -p wa -k cron
    owner: root
    group: root
    mode: "0600"
  notify: restart auditd

- name: Disable unused filesystems (CIS 1.1)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/cis-disable-filesystems.conf
    content: |
      install cramfs /bin/true
      install freevxfs /bin/true
      install jffs2 /bin/true
      install hfs /bin/true
      install hfsplus /bin/true
      install squashfs /bin/true
      install udf /bin/true
    owner: root
    group: root
    mode: "0644"

- name: Set kernel hardening parameters via sysctl
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { key: "net.ipv4.conf.all.send_redirects",    value: "0" }
    - { key: "net.ipv4.conf.all.accept_redirects",  value: "0" }
    - { key: "net.ipv4.conf.all.log_martians",      value: "1" }
    - { key: "net.ipv4.tcp_syncookies",              value: "1" }
    - { key: "kernel.randomize_va_space",            value: "2" }
