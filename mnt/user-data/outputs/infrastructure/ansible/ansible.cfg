# =============================================================================
# ansible.cfg
# Project-level Ansible configuration.
# This file is read automatically when ansible commands run from this directory.
# =============================================================================

[defaults]
inventory           = inventory/hosts.yml
roles_path          = roles
collections_path    = /home/ansible/collections
remote_user         = ansible
private_key_file    = /home/ansible/.ssh/id_ed25519
host_key_checking   = false         # Set true in production with known_hosts
retry_files_enabled = false
stdout_callback     = default
interpreter_python  = auto_silent
#vault_password_file = /home/ansible/.vault/.vault-password

# Increase forks for parallel execution across workers
forks               = 10

# Log to file for auditability
log_path            = /home/ansible/ansible.log

[privilege_escalation]
become        = true
become_method = sudo
become_user   = root
become_ask_pass = false

[ssh_connection]
pipelining              = true
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path_dir        = /home/ansible/cp


