# =============================================================================
# ansible.cfg
# Project-level Ansible configuration.
# This file is read automatically when ansible commands run from this directory.
# =============================================================================

[defaults]
inventory           = inventory/hosts.yml
roles_path          = roles
collections_path    = ~/.ansible/collections
remote_user         = ansible
private_key_file    = ~/.ssh/id_ed25519
host_key_checking   = false         # Set true in production with known_hosts
retry_files_enabled = false
stdout_callback     = default
interpreter_python  = auto_silent

# Increase forks for parallel execution across workers
forks               = 10

# Log to file for auditability
log_path            = ~/.ansible/ansible.log

[privilege_escalation]
become        = false
become_method = sudo
become_user   = root
become_ask_pass = false

[ssh_connection]
pipelining              = true
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path_dir        = ~/.ansible/cp

[vault]
# Path to vault password file (contains the ansible-vault password)
# Create with: echo "your-vault-password" > ~/.vault/.vault-password
# chmod 600 ~/.vault/.vault-password
vault_password_file = ~/.vault/.vault-password
