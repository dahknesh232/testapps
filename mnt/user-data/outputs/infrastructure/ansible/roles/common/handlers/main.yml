---
# =============================================================================
# roles/common/handlers/main.yml
# =============================================================================

- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted

- name: restart services if needed
  ansible.builtin.debug:
    msg: "Packages upgraded — manual service restart may be required if kernel was updated."
