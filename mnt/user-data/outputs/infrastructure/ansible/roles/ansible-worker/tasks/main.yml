---
# =============================================================================
# roles/ansible-worker/tasks/main.yml
# Configures worker LXCs to receive and execute delegated Ansible tasks.
# Installs tooling required by infra and app workers.
# =============================================================================

- name: Install Python3 and pip
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - curl
      - wget
      - unzip
      - ufw
    state: present

- name: Install Docker (required on both workers)
  ansible.builtin.include_tasks: install-docker.yml

- name: Install kubectl (required on app worker)
  ansible.builtin.include_tasks: install-kubectl.yml
  when: worker_role == "app"

- name: Install KIND (required on infra worker)
  ansible.builtin.include_tasks: install-kind.yml
  when: worker_role == "infra"

- name: Install Python packages for worker operations
  ansible.builtin.pip:
    name:
      - hvac
      - proxmoxer
      - requests
      - jmespath
      - netaddr
    state: present
    extra_args: "--break-system-packages"

- name: Setting up Unprivileged Ports
  ansible.builtin.command:
    cmd: "echo net.ipv4.ip_unprivileged_port_start=0 >> /etc/sysctl.conf"

- name: Running sysctl -p ...
  ansible.builtin.command:
    cmd: sysctl -p

