---
# =============================================================================
# roles/k3s/tasks/distribute-kubeconfig.yml
# Fetches kubeconfig from k3s control plane, renames all references to
# the "devel" context, then merges it into ~/.kube/config on runner-01.
# Idempotent — safe to re-run on every site.yml execution.
# =============================================================================

- name: Fetch raw kubeconfig from control plane
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/k3s-devel-raw.yaml
    flat: true
  delegate_to: "{{ groups['k8s_nodes'] |
                   map('extract', hostvars) |
                   selectattr('k8s_role', 'equalto', 'control') |
                   map(attribute='inventory_hostname') |
                   first }}"
  run_once: true

- name: Rewrite server address and rename context to devel
  ansible.builtin.shell:
    cmd: |
      sed \
        -e 's|https://127\.0\.0\.1:6443|https://{{ k3s_control_ip }}:6443|g' \
        -e 's/\bname: default\b/name: devel/g' \
        -e 's/\bcluster: default\b/cluster: devel/g' \
        -e 's/\bcontext: default\b/context: devel/g' \
        -e 's/\bcurrent-context: default\b/current-context: devel/g' \
        -e 's/\buser: default\b/user: devel/g' \
        /tmp/k3s-devel-raw.yaml > /tmp/k3s-devel.yaml
  vars:
    k3s_control_ip: >-
      {{ hostvars[groups['k8s_nodes'] |
         map('extract', hostvars) |
         selectattr('k8s_role', 'equalto', 'control') |
         map(attribute='inventory_hostname') |
         first]['ansible_host'] }}
  delegate_to: localhost
  become: false
  run_once: true

- name: Ensure ~/.kube directory exists on runner-01
  ansible.builtin.file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Check if existing kubeconfig is present on runner-01
  ansible.builtin.stat:
    path: /home/ansible/.kube/k3s-devel.yaml
  register: existing_kubeconfig
  delegate_to: localhost
  become: false
  run_once: true

- name: Seed kubeconfig if none exists yet
  ansible.builtin.copy:
    src: /tmp/k3s-devel.yaml
    dest: /home/ansible/.kube/k3s-devel.yaml
    owner: ansible
    group: ansible
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  when: not existing_kubeconfig.stat.exists

- name: Ensure ~/.kube exists on controller-01
  ansible.builtin.file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: "0700"
  delegate_to: controller-01
  run_once: true

- name: Ensure ~/.kube exists on worker-02
  ansible.builtin.file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: "0700"
  delegate_to: worker-02
  run_once: true

- name: Ensure ~/.kube exists on k8s-worker-01
  ansible.builtin.file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: "0700"
  delegate_to: k8s-worker-01
  run_once: true


- name: Ensure ~/.kube exists on k8s-worker-02
  ansible.builtin.file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: "0700"
  delegate_to: k8s-worker-02
  run_once: true

- name: Distribute kubeconfig to controller-01
  ansible.builtin.copy:
    src: /home/ansible/.kube/k3s-devel.yaml
    dest: /home/ansible/.kube/config
    owner: ansible
    group: ansible
    mode: "0600"
  delegate_to: controller-01
  run_once: true

- name: Distribute kubeconfig to worker-02
  ansible.builtin.copy:
    src: /home/ansible/.kube/k3s-devel.yaml
    dest: /home/ansible/.kube/config
    owner: ansible
    group: ansible
    mode: "0600"
  delegate_to: worker-02
  run_once: true

- name: Distribute kubeconfig to k8s-worker-01
  ansible.builtin.copy:
    src: /home/ansible/.kube/k3s-devel.yaml
    dest: /home/ansible/.kube/config
    owner: ansible
    group: ansible
    mode: "0600"
  delegate_to: k8s-worker-01
  run_once: true

- name: Distribute kubeconfig to k8s-worker-02
  ansible.builtin.copy:
    src: /home/ansible/.kube/k3s-devel.yaml
    dest: /home/ansible/.kube/config
    owner: ansible
    group: ansible
    mode: "0600"
  delegate_to: k8s-worker-02
  run_once: true


- name: Verify cluster is reachable from runner-01
  ansible.builtin.command:
    cmd: kubectl get nodes --context=devel
  environment:
    KUBECONFIG: /home/ansible/.kube/config
  delegate_to: localhost
  become: false
  run_once: true
  register: kubectl_verify
  changed_when: false

- name: Show cluster node status
  ansible.builtin.debug:
    msg: "{{ kubectl_verify.stdout_lines }}"
  run_once: true