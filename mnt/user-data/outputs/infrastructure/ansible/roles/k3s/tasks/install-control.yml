---
# =============================================================================
# roles/k3s/tasks/install-control.yml
# Installs k3s server (control plane) with LXC-compatible configuration.
# Writes /etc/rancher/k3s/config.yaml before install to ensure kubelet
# feature gates are applied on first boot.
# =============================================================================

- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write k3s server config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      # k3s server config — LXC-compatible
      flannel-backend: "host-gw"
      disable:
        - traefik
        - metrics-server
      kubelet-arg:
        - "feature-gates=KubeletInUserNamespace=true"
      kube-apiserver-arg:
        - "feature-gates=KubeletInUserNamespace=true"
      kube-controller-manager-arg:
        - "feature-gates=KubeletInUserNamespace=true"

- name: Install k3s server on control plane
  ansible.builtin.shell:
    cmd: >
      curl -sfL https://get.k3s.io | sh -s - server
      --cluster-init
      --node-ip {{ ansible_host }}
      --advertise-address {{ ansible_host }}
      --write-kubeconfig-mode 0644
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: stable

- name: Wait for k3s to be ready on control plane
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

#- name: Wait for API server to become healthy
#  ansible.builtin.uri:
#    url: "https://{{ ansible_host }}:6443/readyz"
#    validate_certs: false
#    status_code: 200
#  register: api_ready
#  retries: 30
#  delay: 10
#  until: api_ready.status == 200

- name: Read k3s agent token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/agent-token
  register: k3s_token_raw

- name: Set k3s token fact (available to workers via hostvars)
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Save kubeconfig to runner-01
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ansible/.kube/k3s-config.yaml
    flat: true

- name: Fix kubeconfig server address
  ansible.builtin.replace:
    path: /home/ansible/.kube/k3s-config.yaml
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false

- name: Ensure k3s service is enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
