---
# =============================================================================
# roles/k3s/tasks/install-control.yml
# Installs k3s server (control plane).
# =============================================================================

- name: Install k3s server
  ansible.builtin.shell:
    cmd: >
      curl -sfL https://get.k3s.io | sh -s - server
      --cluster-init
      --node-ip {{ ansible_host }}
      --advertise-address {{ ansible_host }}
      --write-kubeconfig-mode 0644
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: stable

- name: Wait for k3s to be ready
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 60

- name: Read k3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Set k3s token fact
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Save kubeconfig to runner-01
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ansible/.kube/k3s-config.yaml
    flat: true

- name: Fix kubeconfig server address
  ansible.builtin.replace:
    path: /home/ansible/.kube/k3s-config.yaml
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false

- name: Ensure k3s service is enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true