---
# =============================================================================
# roles/ansible-worker/tasks/install-kind.yml
# Installs KIND (Kubernetes IN Docker) on the infra worker.
# =============================================================================

- name: Get latest KIND version
  ansible.builtin.uri:
    url: https://api.github.com/repos/kubernetes-sigs/kind/releases/latest
    return_content: true
  register: kind_release

- name: Set KIND version fact
  ansible.builtin.set_fact:
    kind_version: "{{ (kind_release.content | from_json).tag_name }}"

- name: Download KIND binary
  ansible.builtin.get_url:
    url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
    dest: /usr/local/bin/kind
    mode: "0755"
    owner: root
    group: root

- name: Verify KIND installation
  ansible.builtin.command:
    cmd: kind version
  register: kind_version_output
  changed_when: false

- name: Log KIND version
  ansible.builtin.debug:
    msg: "KIND installed: {{ kind_version_output.stdout }}"
