- name: Build Docker Images
  command: docker build -t dahknesh232/testapps:{{ item.tag }} {{ item.context }}
  with_items:
    - { tag: "nodejs-app-dev", context: "$PROJ_DIR/nodejs_apps/dev-app" }
    - { tag: "nodejs-app-dev-latest", context: "$PROJ_DIR/nodejs_apps/dev-app" }
    - { tag: "kyc-dev-v1.0.2", context: "$PROJ_DIR/kyc_files" }
    - { tag: "kyc-dev-latest", context: "$PROJ_DIR/kyc_files" }
    - { tag: "pgs-dev-v1.0.2", context: "$PROJ_DIR/pgs_files" }
    - { tag: "pgs-dev-latest", context: "$PROJ_DIR/pgs_files" }
